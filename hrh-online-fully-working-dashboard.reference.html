<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HRH Online — Fully Working Dashboard Reference</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f9fc; --card:#ffffff; --line:#dfe6ef; --line2:#e9eef4;
      --ink:#111a2d; --muted:#66758b; --navy:#174879; --navy2:#113a67;
      --orange:#e8a11b; --soft-orange:#fff3df; --blue:#3f79d1;
      --red:#e94343; --green:#21a753; --warn:#95670a; --soft:#eef2f7;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}
    body{min-width:1180px}
    button,select,input{font:inherit}
    .app{display:grid;grid-template-columns:186px minmax(0,1fr);min-height:100vh}
    .sidebar{background:#fff;border-right:1px solid var(--line);padding:18px 8px 18px;position:sticky;top:0;height:100vh;overflow:auto}
    .brand{font-family:"Bebas Neue",sans-serif;font-size:31px;letter-spacing:.3px;padding:0 12px 18px}
    .nav{display:flex;flex-direction:column;gap:2px}
    .nav-section{padding:13px 8px 5px;color:#6d88b3;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
    .nav-link{display:flex;align-items:center;gap:10px;text-decoration:none;color:#345070;font-size:12.5px;padding:9px 10px;border-radius:7px;line-height:1.12}
    .nav-link:hover{background:#f6f8fb}.nav-link.active{background:var(--soft-orange);color:#684600}
    .nav-icon{width:18px;text-align:center;color:#6682a7}
    .main{padding:22px 22px 18px;overflow:hidden}
    .page{display:none}.page.active{display:block}
    .header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:14px}
    .header h1{margin:0;font-size:35px;line-height:1;letter-spacing:-.8px}.subtitle{margin-top:6px;color:var(--muted);font-size:13.5px}
    .controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.control-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .select,.pill,.date-chip,.btn{height:40px;border:1px solid #d7e0eb;background:#fff;border-radius:7px;color:#1f2b42;font-size:12.5px;font-weight:600;padding:0 14px}
    .select{min-width:170px}.pill{min-width:120px;cursor:pointer}.pill.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .date-chip{display:flex;align-items:center;color:#5d6f88;background:#eef2f7}
    .btn{cursor:pointer}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
    .custom-range{display:none;gap:8px;align-items:center}.custom-range.show{display:flex}
    .custom-range input{height:38px;border:1px solid #d7e0eb;border-radius:7px;padding:0 10px;background:#fff}
    .kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:16px}
    .kpi{background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:6px;padding:16px 16px 15px;min-height:126px}
    .kpi-label{text-transform:uppercase;color:#627187;font-weight:700;font-size:11.5px;letter-spacing:.03em}
    .kpi-value{font-size:25px;font-weight:700;margin-top:13px}.kpi-sub{display:flex;align-items:center;gap:12px;margin-top:9px;font-size:11.5px;color:#697893}
    .kpi-delta{font-weight:700}.down{color:#ef3e48}.up{color:#11a841}
    .grid3{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:12px;margin-bottom:12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid21{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
    .panel{background:#fff;border:1px solid var(--line);border-top:3px solid var(--orange);border-radius:6px;overflow:hidden}
    .panel-head{padding:11px 13px 8px}.panel-title{margin:0;font-size:15.5px;font-weight:700}.panel-sub{margin-top:3px;font-size:10.8px;color:var(--muted)}
    .panel-body{padding:0 11px 11px}.chartbox{height:190px;border-top:1px solid #eef2f6;position:relative;background:linear-gradient(#f3f6fa 1px,transparent 1px),linear-gradient(90deg,#f3f6fa 1px,transparent 1px);background-size:100% 37px,66px 100%}
    .chartbox svg{width:100%;height:100%}.legend{position:absolute;top:6px;right:8px;display:flex;gap:12px;color:#6b7990;font-size:10.5px;z-index:2}
    .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
    .donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center;min-height:190px}
    .donut{width:132px;height:132px;border-radius:50%;background:conic-gradient(#3f79d1 0 62.5%,#f05b69 62.5% 94.6%,#f59a40 94.6% 100%);position:relative;margin:auto}
    .donut:after{content:"";position:absolute;inset:31px;background:#fff;border-radius:50%}.donut-label{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:700}
    .metric-list{display:flex;flex-direction:column;gap:10px;font-size:10.5px}.metric-row{display:grid;grid-template-columns:10px 1fr 44px;gap:7px;align-items:center}.metric-row strong{text-align:right}
    .barlist{display:flex;flex-direction:column;gap:10px;padding:7px 0 5px}.barrow{display:grid;grid-template-columns:110px 1fr 56px;gap:7px;align-items:center;font-size:10.5px}.track{height:8px;border-radius:99px;background:#edf1f5;overflow:hidden}.fill{height:100%;background:#4f83c9;border-radius:99px}
    table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:10.3px}
    th{background:#eef3f8;color:#223451;text-align:left;padding:7px 6px;border-bottom:1px solid #dde5ee;font-weight:700}
    td{padding:6.5px 6px;border-bottom:1px solid #e8edf3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    td.wrap{white-space:normal;line-height:1.15}.num{text-align:right}.center{text-align:center}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:9.5px;font-weight:600}.badge.good{background:#dcf6e5;color:#168c42}.badge.warn{background:#fff0c3;color:#91640a}.badge.bad{background:#fee1e1;color:#d93434}.badge.neutral{background:#edf0f4;color:#6a7483}
    .panel-foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #edf1f5;padding:9px 10px;color:#66758b;font-size:10px}
    .pager{display:flex;gap:3px}.pager button{width:28px;height:28px;border:1px solid #d8e1ec;background:#fff;border-radius:6px;color:#4f6685;cursor:pointer;font-size:10px}.pager button.active{background:var(--navy);border-color:var(--navy);color:#fff}
    .mt{margin-top:12px}.empty{padding:42px 20px;text-align:center;color:#6b7990;border:1px dashed #ccd6e2;border-radius:7px;background:#fbfcfe}
    @media(max-width:1450px){body{min-width:1080px}.app{grid-template-columns:170px minmax(0,1fr)}.main{padding:18px 14px}.pill{min-width:100px;padding:0 10px}.header h1{font-size:31px}table{font-size:9.8px}}
  </style>
</head>

      <a class="nav-link" href="#/channel-performance" data-route="channel-performance"><span class="nav-icon">◉</span>Channel Performance</a>

  <main class="main" id="main"></main>
</div>

["Workzone Hobby Knife Set 29 pieces","₱8,449","₱3,927","33","120","₱23,880"],

function filterControls(){
  return `
  <div class="controls">
    <div class="control-row">
      <select class="select range-select">
        <option>Last 7 Days</option><option selected>Last 30 Days</option><option>Last 90 Days</option><option>Month to Date</option><option>Year to Date</option><option>Custom Range</option>
      </select>
      <button class="pill active">All Channels</button><button class="pill">HMRPH Online</button><button class="pill">TikTok</button><button class="pill">Shopee</button>
    </div>
    <div class="custom-range"><input type="date" value="2026-08-10"><input type="date" value="2026-09-08"><button class="btn primary apply-custom">Apply</button></div>
    <div class="date-chip">▣&nbsp;&nbsp;<span class="date-text">Aug 10, 2026 – Sep 8, 2026</span></div>
  </div>`;
}

function kpiHtml(kpis){
  return `<div class="kpis">${kpis.map(k=>`<div class="kpi"><div class="kpi-label">${k[0]}</div><div class="kpi-value">${k[1]}</div>${k[2]?`<div class="kpi-sub"><span class="kpi-delta ${k[3]||""}">${k[2]}</span></div>`:""}</div>`).join("")}</div>`;
}

function lineChart(){
  return `<div class="chartbox"><div class="legend"><span><span class="dot" style="background:#e8a11b"></span>GMV</span><span><span class="dot" style="background:#6fa3de"></span>Orders</span></div>
  <svg viewBox="0 0 600 190" preserveAspectRatio="none"><g fill="#acd0f4" opacity=".9">
  ${[10,35,60,85,110,135,160,185,210,235,260,285,310,335,360,385,410,435,460,485,510,535,560].map((x,i)=>`<rect x="${x}" y="${130-(i%5)*6}" width="10" height="${44+(i%5)*6}"/>`).join("")}
  </g><polyline points="10,112 35,127 60,102 85,102 110,119 135,115 160,120 185,91 210,77 235,91 260,105 285,91 310,105 335,82 360,50 385,69 410,87 435,82 460,104 485,68 510,51 535,89 560,111 590,78" fill="none" stroke="#e8a11b" stroke-width="3"/></svg></div>`;
}

function donut(title,values=["HMRPH Online","TikTok","Shopee"]){
  return `<div class="donut-wrap"><div style="position:relative"><div class="donut"></div><div class="donut-label"><div>${title}</div></div></div><div class="metric-list">
  <div class="metric-row"><span class="dot" style="background:#3f79d1"></span><span>${values[0]}</span><strong>62.5%</strong></div>
  <div class="metric-row"><span class="dot" style="background:#f05b69"></span><span>${values[1]}</span><strong>32.1%</strong></div>
  <div class="metric-row"><span class="dot" style="background:#f59a40"></span><span>${values[2]}</span><strong>5.4%</strong></div></div></div>`;
}

function table(headers,rows){
  return `<table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

function pagination(total=145){
  return `<div class="panel-foot"><span>Showing 1–10 of ${total}</span><div class="pager"><button>‹</button><button class="active">1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>…</button><button>›</button></div></div>`;
}

function pageContent(p){
  const header = `<div class="header"><div><h1>${p.title}</h1><div class="subtitle">${p.sub}</div></div>${filterControls()}</div>${kpiHtml(p.kpis)}`;
  switch(p.type){
    case "executive":
      return header + `
      <div class="grid3">
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Sales Trend</h2><div class="panel-sub">Daily GMV and Orders for the selected period</div></div><div class="panel-body">${lineChart()}</div></article>

    case "sales":
      return header + `<div class="grid21">
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Sales Over Time</h2><div class="panel-sub">This period vs previous period</div></div><div class="panel-body">${lineChart()}</div></article>
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Sales by Channel</h2></div><div class="panel-body">${donut("₱479,648<br><span style='font-weight:400;color:#6b7890'>Total GMV</span>")}</div></article>
      </div>
      <div class="grid2 mt">
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Sales by Category</h2></div><div class="panel-body"><div class="barlist"><div class="barrow"><span>Electronics</span><div class="track"><div class="fill" style="width:72%"></div></div><strong>24.4%</strong></div><div class="barrow"><span>Home & Living</span><div class="track"><div class="fill" style="width:61%"></div></div><strong>21.7%</strong></div><div class="barrow"><span>Appliances</span><div class="track"><div class="fill" style="width:44%"></div></div><strong>15.3%</strong></div></div></div></article>
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Sales by Store</h2></div><div class="panel-body">${table(["Store","GMV","Orders","Units","AOV"],[["HMR Online","₱299,856","118","1,220","₱2,541"],["TikTok","₱153,892","103","922","₱1,494"],["Shopee","₱25,900","20","132","₱1,295"]])}</div></article>

    case "traffic":

        <article class="panel"><div class="panel-head"><h2 class="panel-title">Traffic by Source</h2></div><div class="panel-body">${donut("12,480<br><span style='font-weight:400;color:#6b7890'>Total Sessions</span>",["Direct","Organic Search","Social"])}</div></article>
      </div>
      <div class="grid2 mt">
        <article class="panel"><div class="panel-head"><h2 class="panel-title">Top Landing Pages</h2></div><div class="panel-body">${table(["#","Path","Sessions"],[["1","/","4,821"],["2","/collections/electronics","2,834"],["3","/products/tcl-55-qled","2,105"],["4","/collections/home-living","1,842"],["5","/products/headphones","1,321"]])}</div></article>

function renderRoute(){
  const raw = location.hash.replace(/^#\//,"");
  const route = pageData[raw] ? raw : "executive-overview";
  document.querySelectorAll(".nav-link").forEach(a=>a.classList.toggle("active",a.dataset.route===route));
  document.getElementById("main").innerHTML = pageContent(pageData[route]);
  bindInteractions();
  window.scrollTo(0,0);
}

function bindInteractions(){
  document.querySelectorAll(".control-row").forEach(row=>{
    const pills=[...row.querySelectorAll(".pill")];
    pills.forEach(btn=>btn.onclick=()=>{pills.forEach(b=>b.classList.remove("active"));btn.classList.add("active")});
  });

  document.querySelectorAll(".range-select").forEach(sel=>{
    sel.onchange=()=>{
      const controls=sel.closest(".controls");
      const custom=controls.querySelector(".custom-range");
      const text=controls.querySelector(".date-text");
      if(sel.value==="Custom Range"){custom.classList.add("show")}
      else{
        custom.classList.remove("show");
        const map={
          "Last 7 Days":"Sep 2, 2026 – Sep 8, 2026",
          "Last 30 Days":"Aug 10, 2026 – Sep 8, 2026",
          "Last 90 Days":"Jun 11, 2026 – Sep 8, 2026",
          "Month to Date":"Sep 1, 2026 – Sep 8, 2026",
          "Year to Date":"Jan 1, 2026 – Sep 8, 2026"
        };
        text.textContent=map[sel.value]||text.textContent;
      }
    };
  });

  document.querySelectorAll(".apply-custom").forEach(btn=>{
    btn.onclick=()=>{
      const wrap=btn.closest(".custom-range"), inputs=wrap.querySelectorAll("input");
      const controls=wrap.closest(".controls"), text=controls.querySelector(".date-text");
      const fmt=v=>new Date(v+"T00:00:00").toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
      if(inputs[0].value && inputs[1].value) text.textContent=`${fmt(inputs[0].value)} – ${fmt(inputs[1].value)}`;
    };
  });

  document.querySelectorAll(".pager").forEach(p=>{
    p.onclick=e=>{
      const b=e.target.closest("button");
      if(!b||!/^\d+$/.test(b.textContent.trim())) return;
      p.querySelectorAll("button").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    };
  });
}

window.addEventListener("hashchange",renderRoute);
renderRoute();
</script>
